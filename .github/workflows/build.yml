name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            artifact_path: target/release/*.exe
          - os: linux
            runner: ubuntu-latest
            artifact_path: target/release/mc112-client

    env:
      CARGO_TERM_COLOR: always
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare Vulkan SDK (Windows)
        if: ${{ matrix.os == 'windows' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install native dependencies (Linux)
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libudev-dev

      - name: Build
        run: cargo build --release --bin mc112-client

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.12.2-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}